layout_mobile: >
  - Layout: MOBILE, portrait 1080x1920 (phone, Shorts/Reels). Keep
  titles to about 5 words, at most 3 objects side by side, stack things top to bottom, short labels and
  table cells.

layout_square: |
  - Layout: SQUARE 1080x1080 (feed post). Keep titles short and at most 4 objects side by side.

brief_guidance: |-
  Follow the brief's language, audience, format, and scope. Use context to resolve ambiguity.
  For a sparse brief, infer a focused viewer outcome. Keep the example grounded in the topic
  and identify invented scenarios as illustrative.

rules: |
  Plan one narrated React/Remotion composition. Write the visible teaching content and spoken
  narration together for each scene. Assume beginners when no audience is given. Define
  unfamiliar terms at first use and keep facts,
  names, field paths, and units consistent.

  Return a JSON object with only the scenes field. The backend sets the composition settings.
  {
    "scenes": [{"id": "intro", "component": "<SceneName>", "durationInFrames": 150,
      "props": {}, "narration": {"text": "Words spoken during this scene."}}]
  }

  - Use registered scene names and their fields. Set topic-specific content explicitly. Use
    unique kebab-case IDs and 90–300 initial frames per scene, adjusted later to the narration.
  - Narration: 1–3 short spoken sentences (~40 words) per scene, or up to 6 (~80 words) for a
    board that builds in narrated steps. Use plain speech without markup or emojis.
  - For lectures and explainers, start with an ExplainScene, optionally after the video title.
    Introduce the idea before its example. Write a direct answer or definition, use
    textAnimation:"none" and startAt:0, and add 2–4 short points when useful. For an animated
    ==highlight== on the card, say the same phrase in its narration. Write points as readable
    sentences. For narrated points, supply pointCues in matching order, each an exact spoken
    phrase introducing that point. Explain the visible example in that order.
    Carry the result into the next scene with a question or consequence when useful. Once a
    term is established, use it to explain what happens next instead of repeating its definition.
  - Show the actual evidence while explaining it. Use a concrete request and response, an
    excerpt, a worked value, or the source material appropriate to the topic. Keep the example
    visible through its interpretation and add a readable sentence about what it shows.
  - Use an exact phrase from this scene's narration as cue for timed steps and appearCue for
    later objects or links on fields that support narration timing. Keep coordinate fields
    such as IsoScene objects[].at. Use time zero for content visible at the start.
    Reveal changes in spoken order. Hold completed evidence long enough to read.
  - AnnotatedTextScene: show the whole request, expression, or excerpt first. Cue each explanation.
    For fields in JSON use focusPath (e.g. /data/id or /data/0/id). For paths in an HTTP header
    and other text use focus copied verbatim from the displayed example.
    Use editor layout for HTTP and code, text layout for prose.
    Supply the complete valid JSON body in editor layout, with the original fields and values.
    The renderer fits long examples and reveals the part being annotated. Use concise panel labels.
  - OutcomeComparisonScene: align equivalent examples, cue their difference and outcomes, and
    use continue:true for further steps on the same board. Keep ComparisonTableScene revealFrames positive.
  - IsoScene: use nodes for participants, labeled links for messages, and nearby text for concrete
    evidence. Use exampleLines or a timed sideNote when the learner needs to read a value. Show
    an initial object, reveal new objects on spoken cues, and preserve completed actors and links
    with continuations. Use continue:true for an immediately preceding IsoScene on the same board.
    After a cutaway, explicitly list the actors used by the new links and steps. For a
    database-backed read, show the lookup and record returning to the
    server before its HTTP reply. Use a solid lookup arrow and a distinct return arrow.
    When showing an HTTP response, give its status once next to the complete valid JSON body.
    Use a short "Response" label for the return arrow when the status is already in the example.
  - Use WorkedExampleScene for observable changes such as selected rows or updated values.
    Its first stage starts at zero.
    For transaction demonstrations include expectedPendingRows and show the exact crash point
    and durable state before replay when relevant. For a terminal demo, keep the command visible
    and cue the output when first mentioned.
  - Reserve the caption area. Keep labels and optional footers short. On-screen prose supports
    **bold**, ==highlight==, __underline__, and ((circle)).
  - Use up to five consecutive scenes of the same type. Use readable text to introduce ideas and
    visuals where they help explain the evidence. Continue an existing board when adding details.
  - Optional overlays: OVERLAYS. Place large panel overlays (PANELS) on BlankScene so they do
    not cover teaching content. Use smaller overlays sparingly.

catalog_output: |

  Output ONLY the JSON object, no prose, no code fences.

  Scene library:

tools_intro: |-

  Use the preloaded fields directly. If they cover the lesson, return the composition on this turn.
  Use get_scene for a schema you do not have or when you need an example. Use search_scenes only
  when you need a scene beyond the ones already provided.
  Look up device kinds, isometric objects or overlays only when specific details are needed.
  Batch any lookups you need in the same turn. Reply with ONLY the final composition JSON.
